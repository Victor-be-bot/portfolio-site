<!DOCTYPE html>
<html lang ="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Taketo Moki</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <a href="#top">Taketo Moki</a>
            <nav>
                <a href="#about">About</a>
                <a href="#works">Works</a>
            </nav>
        </header>
         <main>
            <section id="top">
                <div class="slideshow">
                    <img src="./media/IMG_2900.jpeg" alt="Vancouver view 1" class="slide active">
                    <img src="./media/IMG_0097.jpeg" alt="Vancouver view 2" class="slide">
                    <img src="./media/IMG_0206.jpeg" alt="Vancouver view 3" class="slide">
                    <img src="./media/IMG_2887.jpeg" alt="Vancouver view 4" class="slide">
                    <img src="./media/IMG_9721.jpeg" alt="Vancouver view 5" class="slide">
                    <img src="./media/IMG_8711.jpeg" alt="Vancouver view 6" class="slide">
                </div>
                <div class="hero-overlay"></div>
                <div class="hero-text">
                    <p>Vancouver</p>
                </div>
            </section>
             <!-- タイトルと天気の表示エリア -->
            <section class="main-title-area">
                <h1 class="main-title">
                  Personal<br>
                  Portfolio
                </h1>
                <p id="weather-icon"> </p>
            </section>
            <section id="about">
                <h3>About</h3>
                <p>
                    茂木　尊翔<br>
                    東京都市大学デザイン・データ科学部
                </p>
                <p>
                    専門：UX/UI、インタラクションデザイン<br>
                    スキル：HTML/CSS/Processing/Arduino/Illust
                </p>
            </section>
            <section id="works" class="works">
                <h3>Works</h3>
                <div class="works-controls">
                    <select id="category">
                        <option value="all">すべてのカテゴリ</option>
                    </select>
                    <select id="sort">
                        <option value="new">新しい順</option>
                        <option value="old">古い順</option>
                        <option value="title">タイトル順</option>
                    </select>
                <div id="works-grid"></div>  
            </section>
        </main>
        <footer>
            <p>Elfin Lakes & Canadian Rockies, BC, Canada</p>
            <span>ⓒ　2026 Taketo Moki</span>

        </footer>
        <script src="works.js"></script>
    </body>
</html>
